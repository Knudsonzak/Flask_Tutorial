<style>
    .body {
        max-width: 720px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .form-card {
        background: white;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
    }

    .form-card h2 {
        margin-top: 0;
        margin-bottom: 18px;
        color: #1d3557;
    }

    .input_field {
      width: 100%;
      padding: 14px 20px;
      margin: 10px 0;
      display: inline-block;
      border: 1px solid #ccc;
      border-radius: 12px;
      box-sizing: border-box;
      background: #fafafa;
    }

    .input_submit {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 14px 20px;
      margin: 18px 0 0;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .input_submit:hover {
      background-color: #45a049;
    }

    .message {
      margin-bottom: 16px;
      padding: 14px;
      border-radius: 12px;
    }

    .message.error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }
</style>

{% extends "base.html" %}
{% block body %}
    <div class="body">
        <div class="form-card">
            <h2>Add a New Fishing Boat</h2>

            {% if error %}
                <div class="message error">{{ error }}</div>
            {% endif %}

            {% if success %}
                <div class="message success">{{ success }}</div>
            {% endif %}

            <form action="/create" method="POST">
                <input type="number" name="id" placeholder="Boat ID" class="input_field">
                <input type="text" name="name" placeholder="Boat name (e.g., WaveRunner)" class="input_field">
                <input type="text" name="type" placeholder="Boat type (e.g., Bass Boat)" class="input_field">
                <input type="number" name="owner_id" placeholder="Owner ID" class="input_field">
                <input type="number" name="rental_price" placeholder="Daily rate" class="input_field" step="0.0001">
                <input type="submit" value="Add Fishing Boat" class="input_submit">
            </form>
        </div>
    </div>
{% endblock %}
