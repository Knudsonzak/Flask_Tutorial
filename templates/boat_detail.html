<style>
    .detail-page {
        max-width: 760px;
        margin: 30px auto;
        padding: 0 20px;
    }

    .detail-card {
        background: white;
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
    }

    .detail-card h2 {
        margin: 0 0 18px;
        color: #1d3557;
    }

    .detail-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .detail-card li {
        margin-bottom: 14px;
        color: #333;
        font-size: 1rem;
        line-height: 1.6;
    }

    .detail-card li strong {
        display: inline-block;
        width: 136px;
        color: #457b9d;
    }

    .back-link {
        display: inline-block;
        margin-bottom: 22px;
        color: #1d3557;
        text-decoration: none;
        font-weight: 600;
    }
</style>

{% extends "base.html" %}
{% block body %}
    <section class="detail-page">
        <a href="{{ url_for('get_boats') }}" class="back-link">← Back to boats</a>

        {% if error %}
            <div class="detail-card">
                <h2>Error</h2>
                <p>{{ error }}</p>
            </div>
        {% else %}
            <div class="detail-card">
                <h2>{{ boat['name'] }} 🐠</h2>
                <ul>
                    <li><strong>Boat ID:</strong> {{ boat['id'] }}</li>
                    <li><strong>Type:</strong> {{ boat['type'] }}</li>
                    <li><strong>Owner ID:</strong> {{ boat['owner_id'] }}</li>
                    <li><strong>Daily Rate:</strong> ${{ boat['rental_price'] }}</li>
                </ul>
            </div>
        {% endif %}
    </section>
{% endblock %}
